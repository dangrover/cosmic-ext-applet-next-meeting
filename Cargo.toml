[package]
name = "cosmic-ext-applet-next-meeting"
version = "0.9.4"
edition = "2024"
authors = ["Dan Grover"]
license = "GPL-3.0-only"
description = "Show next meeting in cosmic panel or dock"
repository = "https://github.com/dangrover/cosmic-ext-applet-next-meeting"

[[bin]]
name = "cosmic-ext-applet-next-meeting"
path = "src/main.rs"

[[bin]]
name = "debug_calendars"
path = "src/bin/debug_calendars.rs"

[dependencies]
futures-util = "0.3.31"
i18n-embed-fl = "0.10"
rust-embed = "8.7.2"
tokio = { version = "1.48.0", features = ["full"] }
zbus = { version = "5", features = ["tokio"] }
calcard = "0.3"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
localzone = { version = "0.3", features = ["win_zones"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1"
xdg = "3"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
]

# Uncomment to test a locally-cloned libcosmic
